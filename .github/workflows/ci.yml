name: CI

# Deploys are done by Amplify Hosting, which builds straight from this repo:
#   develop -> the dev site, main -> the prod site (see amplify.yml).
# This workflow checks pull requests before they are merged, which Amplify
# does not do — so a broken build is caught in the PR, not on the live site.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Type-check, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so this catches type errors too.
      - name: Type-check and build
        run: npm run build
        env:
          # Build-time only; the real values come from Amplify's per-branch env vars.
          VITE_API_URL: https://example.invalid
